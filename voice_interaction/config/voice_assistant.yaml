respeaker_node:
  ros__parameters:
    # ALSA capture device, e.g. "plughw:2,0". Empty or "auto" keeps ReSpeaker auto-discovery.
    capture_device: ""
    # true: XVF-3000 hardware VAD; false: adaptive software VAD
    use_hardware_vad: true
    snr_threshold: 3.0  # 软件 VAD 的信噪比触发阈值
    hold_off_ms: 200  # 软件 VAD 判定静音前保持的毫秒数

voice_interaction_node:
  ros__parameters:
    # $(env HOME) is expanded by ParameterFile in the launch file.
    # ---------- ASR 与录音 ----------
    asr_model_dir: "$(env HOME)/ReSpearMicArray/models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20"
    silence_sec: 1.0  # 连续静音多久后结束当前录音
    preroll_ms: 1000  # VAD 触发时补入触发前的音频
    wake_preroll_ms: 2000  # KWS 命中时补入更长的前置音频
    wait_user_timeout_sec: 20.0  # 播放唤醒确认后等待用户说话的超时
    max_utterance_sec: 15.0  # 单次录音的最长时长

    # ---------- 唤醒词与 KWS ----------
    use_wake_word: true
    # kws: lightweight keyword spotter; asr: legacy full-ASR detector; off: VAD only
    wake_detector: "kws"
    wake_word: "小萝卜头"
    # 允许 ASR 的常见同音/繁体输出；仍要求完整四字短语，不匹配半个词。
    wake_word_aliases: ["小萝卜头", "小罗卜头", "小萝卜頭", "小罗布头"]

    kws_model_dir: "$(env HOME)/ReSpearMicArray/models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile"
    kws_encoder: ""
    kws_decoder: ""
    kws_joiner: ""
    kws_tokens: ""
    kws_keywords_file: "$(env HOME)/ReSpearMicArray/voice_interaction/config/wake_words.txt"
    kws_num_threads: 1
    kws_max_active_paths: 4
    kws_num_trailing_blanks: 1
    kws_keywords_score: 3.0
    kws_keywords_threshold: 0.1

    # ---------- 连续对话与插话 ----------
    conversation_timeout_sec: 20.0  # 连续对话无新指令后的退出时间
    enable_barge_in: true  # 播放期间是否允许用户打断
    barge_in_hold_ms: 300  # 连续检测到语音多久后确认插话
    barge_in_guard_ms: 500  # 开始播放后暂时忽略 VAD 的保护时间
    tts_cooldown_ms: 500  # 播放结束后忽略残留回声的时间

    # ---------- LLM ----------
    system_prompt: "你好你是一个语音助手你叫“小萝卜头”。请用简短的语言回答问题，有趣一点。"  # 系统提示词
    max_history: 6  # 保留的 user/assistant 消息数量
    http_proxy: ""  # 可选 HTTP 代理

    # Optional OpenAI-compatible gateway. The API key is read from
    # VOICE_GATEWAY_API_KEY and is never stored in this file.
    gateway_base_url: ""
    gateway_model: ""

    use_ollama: true
    ollama_url: "http://localhost:11434/v1"
    ollama_model: "qwen2.5:1.5b"

    # ---------- TTS ----------
    tts_voice: "zh-CN-XiaoxiaoNeural"  # edge-tts 发音人
    # Audio output device for ffplay. Empty or "default" uses the system default.
    tts_device: ""
    piper_model: "$(env HOME)/ReSpearMicArray/zh_CN-huayan-medium.onnx"  # Piper 离线模型
