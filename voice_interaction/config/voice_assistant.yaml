respeaker_node:
  ros__parameters:
    # ALSA capture device, e.g. "plughw:2,0". Empty or "auto" keeps ReSpeaker auto-discovery.
    capture_device: ""
    # true: XVF-3000 hardware VAD; false: adaptive software VAD
    use_hardware_vad: true
    snr_threshold: 3.0
    hold_off_ms: 200

voice_interaction_node:
  ros__parameters:
    # $(env HOME) is expanded by ParameterFile in the launch file.
    asr_model_dir: "$(env HOME)/ReSpearMicArray/models/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20"
    silence_sec: 1.0
    preroll_ms: 1000
    wake_preroll_ms: 2000
    wait_user_timeout_sec: 20.0
    max_utterance_sec: 15.0

    use_wake_word: true
    # kws: lightweight keyword spotter; asr: legacy full-ASR detector; off: VAD only
    wake_detector: "kws"
    wake_word: "小萝卜头"
    # 允许 ASR 的常见同音/繁体输出；仍要求完整四字短语，不匹配半个词。
    wake_word_aliases: ["小萝卜头", "小罗卜头", "小萝卜頭", "小罗布头"]

    kws_model_dir: "$(env HOME)/ReSpearMicArray/models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01-mobile"
    kws_encoder: ""
    kws_decoder: ""
    kws_joiner: ""
    kws_tokens: ""
    kws_keywords_file: "$(env HOME)/ReSpearMicArray/voice_interaction/config/wake_words.txt"
    kws_num_threads: 1
    kws_max_active_paths: 4
    kws_num_trailing_blanks: 1
    kws_keywords_score: 3.0
    kws_keywords_threshold: 0.1

    conversation_timeout_sec: 20.0

    enable_barge_in: true

    barge_in_hold_ms: 300

    barge_in_guard_ms: 500

    tts_cooldown_ms: 500

    system_prompt: "你好你是一个语音助手你叫“小萝卜头”。和你对话的是一个小朋友。"
    max_history: 6
    http_proxy: ""

    # Optional OpenAI-compatible gateway. The API key is read from
    # VOICE_GATEWAY_API_KEY and is never stored in this file.
    gateway_base_url: ""
    gateway_model: ""

    use_ollama: true
    ollama_url: "http://localhost:11434/v1"
    ollama_model: "qwen2.5:1.5b"

    tts_voice: "zh-CN-XiaoxiaoNeural"
    tts_device: "plughw:3,0"
    piper_model: "$(env HOME)/ReSpearMicArray/zh_CN-huayan-medium.onnx"
